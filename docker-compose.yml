services:
  api:
    build: .
    environment:
      APP_ENVIRONMENT: local
      APP_LOG_LEVEL: INFO
      APP_POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/transactions
      APP_REDIS_URL: redis://redis:6379/0
      APP_REDIS_STREAM_NAME: transactions
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build: .
    command: [ "alembic", "upgrade", "head" ]
    environment:
      APP_ENVIRONMENT: local
      APP_LOG_LEVEL: INFO
      APP_POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/transactions
      APP_REDIS_URL: redis://redis:6379/0
      APP_REDIS_STREAM_NAME: transactions
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d transactions" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
